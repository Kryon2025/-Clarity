name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python run.py --smoke

      - name: Build exe (onedir)
        run: python -m PyInstaller --noconfirm --clean packaging/ShenQing.spec

      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "manual-$tag" }
          Compress-Archive -Path "dist/深清/*" -DestinationPath "dist/ShenQing-Portable-$tag.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\installer.iss" "/DAppVersion=$version"

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ShenQing-build
          path: |
            dist/ShenQing-Portable-*.zip
            dist/installer/ShenQing-Setup-*.exe

      - name: Publish GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShenQing-Portable-*.zip
            dist/installer/ShenQing-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
